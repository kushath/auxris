[workspace]
members = ["crates/auxris-core"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/satoshi-kris/auxris"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
