name: Bug report
description: Report a reproducible defect in a supported Auxris path.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not report security issues here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and the smallest reproduction you can share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Auxris version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation method, and relevant audio format.
    validations:
      required: true

