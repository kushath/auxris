version: 2
updates:
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]
