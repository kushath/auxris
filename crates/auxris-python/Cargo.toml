[package]
name = "auxris-python"
version = "0.2.0-alpha.1"
description = "Optional Python bindings for the Auxris native kernel"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "auxris_native"
crate-type = ["cdylib"]

[dependencies]
auxris-core = { path = "../auxris-core" }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py311", "extension-module"] }

[lints]
workspace = true
