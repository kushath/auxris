[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "auxris-native"
version = "0.2.0a1"
description = "Optional native fingerprint kernel for Auxris"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[tool.maturin]
manifest-path = "../../crates/auxris-python/Cargo.toml"
bindings = "pyo3"
module-name = "auxris_native"
